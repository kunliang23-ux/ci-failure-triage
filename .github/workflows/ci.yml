name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        id: build
        env:
          TRIAGE_ENVIRONMENT: github-actions/ubuntu-latest
          TRIAGE_TRIGGERING_HEAD: ${{ github.event_name != 'pull_request' && github.sha || github.event.pull_request.head.sha }}
        run: python3 .github/scripts/triage-bundle.py build

      - name: Collect triage evidence
        id: bundle
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: python3 .github/scripts/triage-bundle.py collect

      - name: Upload triage bundle
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-triage-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ci-triage-bundle/
          if-no-files-found: error
